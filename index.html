<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer Parcial</title>

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f0f4f8;
            color: #475569;
            text-align: center;
            padding: 60px 20px;
        }

        .contenedor {
            background-color: #ffffff;
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h1 {
            color: #0f172a;
            margin-bottom: 16px;
            font-size: 28px;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .boton {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .boton:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Primer Parcial</h1>
        <p>
            Esta es mi página para el primer parcial de <strong>Electiva 2</strong> sobre <strong>Integración Continua</strong>.
        </p>
        <a class="boton" href="https://github.com/rubymartinezrosa-dot/PrimerParcial" target="_blank">
            Ver mi GitHub
        </a>
    </div>

</body>
</html>
